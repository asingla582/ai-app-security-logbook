# Supabase (Postgres, Auth) runs via the Supabase CLI on the host, not here.
# These two services are the application; they talk to the host's Supabase stack.
services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    depends_on:
      - api

  # Local trace store. Loopback only: traces carry ids and verdicts, not content, but
  # the OTLP port accepts writes from anyone who can reach it.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
