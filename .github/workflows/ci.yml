name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scorecard:
    # One self-contained gate. Runs ruff, pytest (incl. RLS), vitest, the model
    # suites and Trivy, then scores them. It either runs or fails loudly: there
    # is no skip path. On fork PRs (no secrets) the runner marks the model
    # categories not required; on push and same-repo PRs a missing key FAILs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Supabase
        run: supabase start
      - name: Export Supabase env
        run: |
          supabase status -o json | python3 -c '
          import json, sys
          s = json.load(sys.stdin)
          out = {
              "SUPABASE_URL": s["API_URL"],
              "SUPABASE_DB_URL": s["DB_URL"],
              "SUPABASE_JWT_SECRET": s["JWT_SECRET"],
              "SUPABASE_ANON_KEY": s["ANON_KEY"],
              "SUPABASE_SERVICE_ROLE_KEY": s["SERVICE_ROLE_KEY"],
          }
          with open(__import__("os").environ["GITHUB_ENV"], "a") as f:
              for k, v in out.items():
                  f.write(f"{k}={v}\n")
          '
      - name: Install API (ruff, pytest, provider deps)
        run: python -m pip install -e "apps/api[dev]"
      - name: Install web dependencies (vitest)
        working-directory: apps/web
        run: npm ci
      - name: Scorecard
        # The runner works out push / pull_request / fork_pr itself from
        # GITHUB_EVENT_NAME and the event payload.
        env:
          PYTHON: python
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: make scorecard-ci
      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard
          path: .scorecard/
          include-hidden-files: true
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
